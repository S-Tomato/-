
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的图片相册</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #222;
    }
    h1 { text-align: center; }
    .gallery {
      max-width: 1000px;
      margin: 24px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .gallery img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 12px;
      background: #ddd;
      cursor: pointer;
    }
    .gallery img:hover { opacity: .9; }
    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: #000e;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #viewer img {
      max-width: 95%;
      max-height: 90vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <h1>我的图片相册</h1>
  <p style="text-align:center">欢迎浏览我的图片合集</p>

  <div class="gallery">
    <img src="photo1.jpg" alt="照片1">
    <img src="photo2.jpg" alt="照片2">
    <img src="photo3.jpg" alt="照片3">
  </div>

  <div id="viewer" onclick="this.style.display='none'">
    <img id="large" alt="大图">
  </div>

  <script>
    document.querySelectorAll(".gallery img").forEach(img => {
      img.onclick = () => {
        document.getElementById("large").src = img.src;
        document.getElementById("viewer").style.display = "flex";
      };
    });
  </script>
</body>
</html>
